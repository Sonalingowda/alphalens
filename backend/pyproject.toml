[project]
name = "alphalens-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "prometheus-client>=0.23.1",
    "redis>=7.1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "shap>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.51.0",
    "websockets>=15.0.1",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
