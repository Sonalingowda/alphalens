# Minimal Fly.io deployment configuration for the existing backend image.
app = "alphalens-backend"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ALPHALENS_ENVIRONMENT = "production"
  ALPHALENS_API_NAME = "AlphaLens API"
  ALPHALENS_API_HOST = "0.0.0.0"
  ALPHALENS_API_PORT = "8000"
  ALPHALENS_API_WORKERS = "1"
  ALPHALENS_LOG_LEVEL = "INFO"
  ALPHALENS_CORS_ALLOWED_ORIGINS = "https://alphalens-navy.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30m"
    path = "/health/readiness"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
