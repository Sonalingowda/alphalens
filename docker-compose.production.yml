services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  redis:
    command: ["redis-server", "--appendonly", "no", "--save", "", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]

  backend:
    environment: &production-backend-environment
      ALPHALENS_ENVIRONMENT: production
      ALPHALENS_API_NAME: AlphaLens API
      ALPHALENS_API_HOST: 0.0.0.0
      ALPHALENS_API_PORT: 8000
      ALPHALENS_API_WORKERS: ${ALPHALENS_API_WORKERS:-2}
      ALPHALENS_LOG_LEVEL: ${ALPHALENS_LOG_LEVEL:-INFO}
      ALPHALENS_CORS_ALLOWED_ORIGINS: ${ALPHALENS_CORS_ALLOWED_ORIGINS:?Set ALPHALENS_CORS_ALLOWED_ORIGINS}
      ALPHALENS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ALPHALENS_DATABASE_POOL_SIZE: ${ALPHALENS_DATABASE_POOL_SIZE:-10}
      ALPHALENS_DATABASE_MAX_OVERFLOW: ${ALPHALENS_DATABASE_MAX_OVERFLOW:-20}
      ALPHALENS_DATABASE_POOL_TIMEOUT_SECONDS: ${ALPHALENS_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      ALPHALENS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALPHALENS_METRICS_ENABLED: "true"
      ALPHALENS_WORKER_CONCURRENCY: ${ALPHALENS_WORKER_CONCURRENCY:-4}
      ALPHALENS_WORKER_POLL_SECONDS: ${ALPHALENS_WORKER_POLL_SECONDS:-1}
      ALPHALENS_WORKER_MAX_RETRIES: ${ALPHALENS_WORKER_MAX_RETRIES:-3}

  worker:
    environment: *production-backend-environment

  frontend:
    environment:
      ALPHALENS_API_BASE_URL: http://backend:8000
      NODE_ENV: production
